name: Build UniXNU-pyxis Boot Package & UEFI Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UniXNU-pyxis
        uses: actions/checkout@v4

      - name: Set up build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler mtools dosfstools python3 python3-pip uuid-dev nasm acpica-tools gzip

      - name: Inspect Device Tree & Environment
        run: |
          dtc -I dtb -O dts -o dts/verified_pyxis.dts dts/pyxis.dtb
          cat board.toml
          cat configs/pyxis_defconfig

      - name: Verify Patches
        run: |
          while IFS= read -r patch; do
            [ -z "$patch" ] && continue
            test -f "patches/$patch" || exit 1
          done < patches/series

      - name: Build Sparse RootFS RAMDisk
        run: |
          mkdir -p out/boot/esp/root
          dd if=/dev/zero of=out/rootfs.img bs=1M count=32
          python3 scripts/pack_ramdisk.py out/rootfs.img -o out/boot/esp/root/ramdisk.packed

      - name: Synthesize Boot Payload & ESP Image
        run: |
          mkdir -p out/boot/esp
          cat << 'EOF' > out/boot/esp/unixnu.toml
          title = "UniXNU Xiaomi Mi 9 Lite (pyxis)"
          default = "darwin"
          timeout = 3

          [[entry]]
          name = "darwin"
          title = "Darwin / XNU (iOS 16.5)"
          loader = "DarwinBoot.efi"
          args = "-v serial=3 debug=0x14e armcpu-spi-ipi=1 -no_slto_panic native-ram-root=1 pyxis-touch=1"
          dtb = "pyxis.dtb"
          ramdisk = "root/ramdisk.packed"
          EOF
          cp dts/pyxis.dtb out/boot/esp/pyxis.dtb
          dd if=/dev/zero of=out/pyxis-esp.img bs=1M count=128
          mkfs.vfat -F 32 -n "PYXISESP" out/pyxis-esp.img
          mcopy -i out/pyxis-esp.img -s out/boot/esp/* ::/

      - name: Assemble UEFI Android Boot Image
        run: |
          bash scripts/build_uefi_img.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyxis-boot-package
          path: |
            out/uefi.img
            out/pyxis-esp.img
            board.toml
            configs/pyxis_defconfig
            patches/
            drivers/
            scripts/
            dts/pyxis.dtb
            edk2-platform/pyxis/pyxis.dsc
            edk2-platform/pyxis/pyxis.fdf
